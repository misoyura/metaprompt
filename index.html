<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선문대학교 프롬프트 리터러시 특강 · 강의 자료실</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-index">

<div class="statusbar"></div>

<header class="hero">
  <div class="wrap">
    <span class="logo"></span>
    <h1>AI에게 제대로 질문하고, 제대로 확인하는 방법</h1>
    <p>차시를 선택하면 강의안으로 이동합니다.</p>
    <p class="meta"></p>
  </div>
</header>

<main>
  <div class="wrap">

    <section id="sessions">
      <div class="sec-title">
        <span class="dot"></span>
        <h2>강의 목차</h2>
        <span class="hint">카드를 누르면 해당 차시로 이동</span>
      </div>

      <!-- 차시 추가 방법: data.js의 SESSIONS 배열에 항목을 추가하면 이 카드 목록에 자동 반영됩니다. -->
      <div class="grid" id="session-grid"></div>
    </section>

    <section id="downloads">
      <div class="sec-title">
        <span class="dot"></span>
        <h2>강의 자료 다운로드</h2>
      </div>

      <div class="dl-group">
        <div class="dl-row">
          <span class="fname">📑 강의 자료</span>
          <a class="dl-btn disabled" href="#">준비중</a>
        </div>
        <div class="dl-row">
          <span class="fname">🗂 실습 파일</span>
          <a class="dl-btn disabled" href="#">준비중</a>
        </div>
      </div>

      <p class="notice">※ 자료 다운로드 링크는 준비되는 대로 연결됩니다.</p>
    </section>

  </div>
</main>

<footer id="site-footer"></footer>

<script src="data.js"></script>
<script src="app.js"></script>
<script>initIndexPage();</script>

</body>
</html>
